name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, build and pack (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test with production-source coverage
        run: pnpm exec jest --runInBand --coverage

      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node22-jest-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify release-notes generator compatibility
        run: pnpm run test:release-notes

      - name: Build
        run: pnpm run build

      - name: Validate publishable package
        run: |
          test -f dist/nodes/Bluesky/Bluesky.node.js
          test -f dist/nodes/BlueskyTrigger/BlueskyTrigger.node.js
          test -f dist/credentials/BlueskyApi.credentials.js
          node -e "const pkg=require('./package.json'); if (!pkg.files.includes('index.js')) process.exit(1); require('./index.js')"
          test ! -f dist/package.json
          test ! -d dist/__tests__
          test ! -d dist/src
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/n8n-nodes-the-bluesky-*.tgz | grep -q 'package/dist/nodes/Bluesky/Bluesky.node.js'
          tar -tzf "$RUNNER_TEMP"/n8n-nodes-the-bluesky-*.tgz | grep -q 'package/index.js'

