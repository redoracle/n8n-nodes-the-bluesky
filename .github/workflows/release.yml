name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  # npm Trusted Publishing: short-lived OIDC credentials.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Pin npm CLI for trusted publishing
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm exec jest --runInBand

      - name: Verify release-notes generator compatibility
        run: pnpm run test:release-notes

      - name: Build
        run: pnpm run build

      - name: Gate - package must survive n8n's community-package install
        run: pnpm run test:install

      - name: Check GitHub Actions OIDC context
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "::error::GitHub OIDC request URL unavailable"; exit 1; }

      - name: Release via npm Trusted Publishing (OIDC)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
