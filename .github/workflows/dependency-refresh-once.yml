# Temporary branch-scoped validation of compatible dependency updates.
# Removed from the branch after the update experiment.
name: Compatible dependency refresh (one-time)

on:
  push:
    branches:
      - quality/ci-build-parser-docs-20261105

permissions:
  contents: write

jobs:
  refresh:
    if: "github.event.head_commit.message == 'chore: start one-time semver dependency refresh'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Update within existing manifest ranges
        run: pnpm up
      - name: Verify compatible upgrades
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm exec jest --runInBand
          pnpm build
          test -f dist/nodes/Bluesky/Bluesky.node.js
          test ! -d dist/__tests__
      - name: Commit verified lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh semver-compatible locked versions"
            git push origin HEAD:quality/ci-build-parser-docs-20261105
          fi
